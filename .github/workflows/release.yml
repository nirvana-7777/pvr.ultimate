name: Release

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'pvr.ultimate/addon.xml.in'

env:
  app_id: pvr.ultimate

permissions:
  contents: write   # needed to read/create GitHub Releases

jobs:
  # 1. Read the version out of addon.xml.in and check whether a release for
  #    it already exists. This is what makes the workflow "run on a new
  #    version" rather than on every push that happens to touch the file.
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      should-release: ${{ steps.check.outputs.should-release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from addon.xml.in
        id: get-version
        run: |
          # addon.xml.in is a CMake template (contains @PLATFORM@ etc. in an
          # attribute name), so it is NOT valid XML until configure_file()
          # substitutes those placeholders — can't use a real XML parser.
          # Isolate just the <addon ...> opening tag first (DOTALL, since it
          # spans multiple lines) before pulling version= out of it, so a
          # version= on some unrelated <import .../> inside <requires> can't
          # be matched instead of the addon's own version.
          VERSION=$(python3 -c "
          import re
          content = open('pvr.ultimate/addon.xml.in', encoding='utf-8').read()
          tag = re.search(r'<addon\b(.*?)>', content, re.DOTALL).group(1)
          print(re.search(r'version=\"([^\"]+)\"', tag).group(1))
          ")
          if [ -z "$VERSION" ]; then
            echo "Could not read version from addon.xml.in"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.get-version.outputs.version }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release v${{ steps.get-version.outputs.version }} already exists — skipping."
            echo "should-release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should-release=true" >> "$GITHUB_OUTPUT"
          fi

  # 2. Reuse the existing build workflows as-is. They just need `workflow_call`
  #    added to their `on:` block (see patch notes below) — nothing about
  #    their build logic changes.
  build-multi:
    needs: check-version
    if: needs.check-version.outputs.should-release == 'true'
    uses: ./.github/workflows/build.yml

  build-android:
    needs: check-version
    if: needs.check-version.outputs.should-release == 'true'
    uses: ./.github/workflows/android-build.yml

  # 3. Collect every zip artifact produced by both matrices and publish them
  #    as one GitHub Release tagged with the addon version.
  release:
    needs: [ check-version, build-multi, build-android ]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '${{ env.app_id }}-*'
          # No merge-multiple: keep each artifact in its own subfolder
          # (named after its unique artifact name). Once the zip filenames
          # below include kodi-branch/OS, this isn't strictly required
          # anymore, but it's a second line of defense against any future
          # naming collision silently dropping a build from the release.

      - name: List collected files
        run: find artifacts -type f -name '*.zip' -exec ls -lh {} \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: v${{ needs.check-version.outputs.version }}
          generate_release_notes: true
          files: artifacts/**/*.zip